plugins {
    id 'com.android.application'
}

def ciBuildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer
def releaseKeystorePath = System.getenv("KEYSTORE_PATH")

android {
    namespace 'ir.lnkee.app'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.lnkee.app'
        minSdk 24
        targetSdk 36
        versionCode ciBuildNumber
        versionName "1.0.${ciBuildNumber}"
    }

    if (releaseKeystorePath != null && !releaseKeystorePath.isEmpty()) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystorePath != null && !releaseKeystorePath.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }
}
