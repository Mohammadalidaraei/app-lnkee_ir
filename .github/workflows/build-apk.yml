name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip

      - name: Decode release signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/lnkee-release.jks
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      - name: Detect release signing key alias
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/lnkee-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KEY_ALIAS=$(keytool -list -v -storetype PKCS12 -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -n 1)
          test -n "$KEY_ALIAS"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/lnkee-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradle-8.13/bin/gradle :app:assembleRelease --no-daemon

      - name: Build debug APK when signing is not configured
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: ./gradle-8.13/bin/gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lnkee-APK
          path: app/build/outputs/apk/**/app-*.apk
          if-no-files-found: error

